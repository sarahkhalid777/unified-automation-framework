<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register | ShopLite</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="site-header"></header>
  <main>
    <h1>Create an account</h1>
    <form class="stack card" data-testid="register-form" novalidate>
      <label>First name <input name="firstName" required data-testid="register-first-name"></label>
      <label>Last name <input name="lastName" required data-testid="register-last-name"></label>
      <label>Email <input type="email" name="email" autocomplete="username" required data-testid="register-email"></label>
      <label>Password <input type="password" name="password" autocomplete="new-password" required data-testid="register-password"></label>
      <div role="alert" data-testid="register-error" hidden></div>
      <button type="submit" data-testid="register-submit">Create account</button>
    </form>
  </main>
  <script type="module" src="/js/app.js"></script>
  <script type="module" src="/js/register.js"></script>
</body>
</html>
