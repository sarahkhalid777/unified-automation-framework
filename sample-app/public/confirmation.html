<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Order confirmed | ShopLite</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="site-header"></header>
  <main>
    <section class="card" data-testid="order-confirmation" hidden>
      <h1>Thank you for your order!</h1>
      <p>Order number: <strong data-testid="order-number"></strong></p>
      <p>Status: <span data-testid="order-status"></span></p>
      <ul data-testid="order-items"></ul>
      <p>Total paid: <strong data-testid="order-total"></strong></p>
      <p>Shipping to: <span data-testid="order-shipping"></span></p>
      <p><a href="/orders">View my orders</a> &middot; <a href="/">Continue shopping</a></p>
    </section>
    <div role="alert" data-testid="confirmation-error" hidden></div>
  </main>
  <script type="module" src="/js/app.js"></script>
  <script type="module" src="/js/confirmation.js"></script>
</body>
</html>
