<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product | ShopLite</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="site-header"></header>
  <main>
    <p><a href="/">&larr; Back to products</a></p>
    <article class="card" data-testid="product-detail" hidden>
      <h1 data-testid="product-name"></h1>
      <p class="muted">SKU <span data-testid="product-sku"></span> &middot; <span data-testid="product-category"></span></p>
      <p data-testid="product-description"></p>
      <p class="price" data-testid="product-price"></p>
      <p class="muted"><span data-testid="product-stock"></span> in stock</p>
      <div class="stack">
        <label>Quantity <input type="number" min="1" max="99" value="1" data-testid="product-quantity"></label>
        <button type="button" data-testid="add-to-cart">Add to cart</button>
      </div>
    </article>
    <div role="status" data-testid="product-message" hidden></div>
  </main>
  <script type="module" src="/js/app.js"></script>
  <script type="module" src="/js/product.js"></script>
</body>
</html>
