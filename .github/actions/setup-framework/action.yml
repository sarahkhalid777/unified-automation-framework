name: Set up the framework
description: Node.js with the npm cache, and the framework's locked dependencies.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: |
          unified-automation-framework/package-lock.json
          sample-app/package-lock.json

    - name: Install framework dependencies
      shell: bash
      working-directory: unified-automation-framework
      run: npm ci --no-audit --no-fund
